<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <main>
      <section>
        <div>
          <h1>お店のこだわり</h1>
          <p>
            いっぱいの珈琲と、優しいおやつ。<br />
            窓辺に光が落ちる小さな喫茶店で、<br />
            ふっと型の力が抜けるひとときを。
          </p>
        </div>
      </section>

      <section>
        <div>
          <h2>珈琲</h2>
          <p>
            自家焙煎の珈琲豆を使用し、<br />
            その日の気分に合わせて、<br />
            豆の種類や焙煎度合いを選べます。<br />
            こだわりの一杯をお楽しみください。
          </p>
        </div>

        <div>
          <h2>おやつ</h2>
          <p>
            手作りの優しいおやつを提供しています。<br />
            季節のフルーツを使ったケーキや、<br />
            しっとりとした焼き菓子など、<br />
            心温まる味わいをお楽しみください。
          </p>
        </div>

        <div>
          <h2>空間</h2>
          <p>
            窓辺に光が差し込む、<br />
            落ち着いた雰囲気の店内で、<br />
            ゆったりとした時間をお過ごしいただけます。<br />
            お一人でも、お友達とでも、<br />
            くつろぎのひとときをお楽しみください。
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
